appId: io.cyberstrike.desktop
productName: CyberStrike
copyright: Copyright © CyberStrike
directories:
  output: dist-desktop
  buildResources: resources

# NOTE (MVP): dev (`bun run dev`) spawns the CyberStrike server from source. A PACKAGED build must also
# bundle the compiled server binary + the built web UI (packages/app/dist) and spawn that binary instead
# of `bun … src/index.ts`. Until that is wired, `package:*` produces an app that runs only where the
# source + bun are present. Icons under resources/ are placeholders.
files:
  - src/main/**
  - package.json

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # icon: resources/icon.icns

win:
  target:
    - nsis
  # icon: resources/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Development
  # icon: resources/icon.png
