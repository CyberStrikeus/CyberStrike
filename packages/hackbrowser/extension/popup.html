<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        width: 220px;
        margin: 0;
        padding: 14px;
        background: #0b0f14;
        color: #d7e0ea;
      }
      h1 {
        font-size: 12px;
        margin: 0 0 4px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7ea8ff;
      }
      p {
        margin: 0 0 12px;
        font-size: 11px;
        line-height: 1.45;
        color: #8aa0b4;
      }
      button {
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 7px;
        font: 600 12px system-ui, sans-serif;
        cursor: pointer;
        background: #1f6feb;
        color: #fff;
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 10px;
        font-size: 10px;
        color: #62708a;
        min-height: 12px;
      }
    </style>
  </head>
  <body>
    <h1>CyberStrike</h1>
    <p>All controls live in the on-page panel — click the CyberStrike logo on the page. This just shows or hides it.</p>
    <button id="toggle">Show / hide panel</button>
    <div class="hint" id="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
