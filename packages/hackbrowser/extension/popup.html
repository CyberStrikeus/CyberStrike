<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        width: 230px;
        margin: 0;
        padding: 14px;
        background: #0b0f14;
        color: #d7e0ea;
      }
      h1 {
        font-size: 12px;
        margin: 0 0 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7ea8ff;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .row .lbl {
        font-size: 12px;
        font-weight: 600;
        color: #d7e0ea;
      }
      /* Master enable/disable switch */
      .switch {
        position: relative;
        width: 46px;
        height: 24px;
        border-radius: 999px;
        border: 0;
        cursor: pointer;
        background: #1f6feb;
        transition: background 0.16s ease;
        flex: none;
        padding: 0;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.16s ease;
        transform: translateX(22px); /* On → knob right */
      }
      .switch.off {
        background: #2a2f3a;
      }
      .switch.off::after {
        transform: translateX(0); /* Off → knob left */
      }
      button.act {
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 7px;
        font: 600 12px system-ui, sans-serif;
        cursor: pointer;
        background: #16212b;
        color: #d7e0ea;
      }
      button.act:active {
        transform: translateY(1px);
      }
      button.act:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .inp {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
        padding: 8px 9px;
        border: 1px solid #1f2b38;
        border-radius: 7px;
        background: #0e151d;
        color: #d7e0ea;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .inp:focus {
        outline: none;
        border-color: #1f6feb;
      }
      hr.sep {
        border: 0;
        border-top: 1px solid #16212b;
        margin: 14px 0;
      }
      p {
        margin: 12px 0 0;
        font-size: 11px;
        line-height: 1.45;
        color: #8aa0b4;
      }
      .hint {
        margin-top: 8px;
        font-size: 10px;
        color: #62708a;
        min-height: 12px;
      }
    </style>
  </head>
  <body>
    <h1>CyberStrike</h1>
    <div class="row">
      <span class="lbl">Extension</span>
      <button id="power" class="switch" title="Enable / disable" aria-label="Enable or disable the extension"></button>
    </div>
    <button id="toggle" class="act">Show / hide panel</button>
    <p>All controls live in the on-page panel — click the CyberStrike logo. Turn the extension off to stop it completely: no capture, nothing running in the background.</p>
    <hr class="sep" />
    <div class="row"><span class="lbl">CyberStrike server</span></div>
    <input id="server" class="inp" placeholder="http://127.0.0.1:4096" spellcheck="false" autocapitalize="off" autocomplete="off" />
    <button id="save" class="act" style="margin-top: 8px">Save &amp; rebind session</button>
    <div class="hint" id="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
