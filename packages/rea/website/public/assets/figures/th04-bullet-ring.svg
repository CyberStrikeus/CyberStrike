    <circle cx="199.843" cy="136.982" r="4.5" class="bullet" data-index="11" data-angle="176" />
    <line x1="245" y1="246" x2="245.000" y2="128.000" class="spoke" />
    <circle cx="245.000" cy="128.000" r="4.5" class="bullet" data-index="12" data-angle="192" />
    <line x1="245" y1="246" x2="290.157" y2="136.982" class="spoke" />
    <circle cx="290.157" cy="136.982" r="4.5" class="bullet" data-index="13" data-angle="208" />
    <line x1="245" y1="246" x2="328.439" y2="162.561" class="spoke" />
    <circle cx="328.439" cy="162.561" r="4.5" class="bullet" data-index="14" data-angle="224" />
    <line x1="245" y1="246" x2="354.018" y2="200.843" class="spoke" />
    <circle cx="354.018" cy="200.843" r="4.5" class="bullet" data-index="15" data-angle="240" />
    <circle cx="245" cy="246" r="7" fill="#20252b" />
    <rect x="215" y="261" width="60" height="26" fill="#ffffff" />
    <text x="245" y="280" text-anchor="middle" class="note">Origin</text>
  </g>
  <g id="aimed-ring" data-count="16" data-aim="40">
    <circle cx="730" cy="246" r="118" fill="none" stroke="#e0e5ea" stroke-dasharray="3 5" />
    <line x1="730" y1="246" x2="795.557" y2="344.113" stroke="#294f82" stroke-width="2.5" />
    <circle cx="795.557" cy="344.113" r="6" class="first" data-index="0" data-angle="40" />
    <line x1="730" y1="246" x2="753.021" y2="361.733" class="spoke" />
