<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">TH04: spacing and aiming a ring of bullets</title>
  <desc id="description">A full clockwise turn has 256 angle units. Sixteen bullets start at angles zero, sixteen, thirty-two, through 240. Adding an example player direction of forty turns all sixteen directions together; the first bullet points at the player. Template rotation is zero.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#294f82" /></marker></defs>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #20252b; } .heading { font-size: 26px; font-weight: 600; } .note { font-size: 19px; fill: #5b6570; } .mono { font-family: Consolas, 'Liberation Mono', monospace; font-size: 19px; } .accent { fill: #294f82; } .spoke { stroke: #d2dbe4; stroke-width: 1.6; } .bullet { fill: #9eafc0; } .first { fill: #294f82; } 
@media (prefers-color-scheme: dark){
svg{background-color:#181825}
[fill="#20252b"]{fill:#cdd6f4}
[fill="#294f82"]{fill:#89b4fa}
[stroke="#294f82"]{stroke:#89b4fa}
[stroke="#e0e5ea"]{stroke:#45475a}
[fill="#edf2f8"]{fill:#313244}
[fill="#ffffff"]{fill:#181825}
text{fill:#cdd6f4}
.note{fill:#a6adc8}
.accent{fill:#89b4fa}
.spoke{stroke:#6c7086}
.bullet{fill:#9399b2}
.first{fill:#89b4fa}
}
</style>
  <rect width="1000" height="520" fill="#ffffff" />
  <line x1="500" y1="42" x2="500" y2="428" stroke="#e0e5ea" />
  <text x="42" y="58" class="heading">Fixed ring</text>
  <text x="42" y="88" class="note">First bullet: angle 0</text>
  <text x="542" y="58" class="heading">Aimed ring</text>
  <text x="542" y="88" class="note">First bullet: player direction</text>
  <g id="fixed-ring" data-count="16" data-aim="0">
    <circle cx="245" cy="246" r="118" fill="none" stroke="#e0e5ea" stroke-dasharray="3 5" />
    <line x1="245" y1="246" x2="363.000" y2="246.000" stroke="#294f82" stroke-width="2.5" />
    <circle cx="363.000" cy="246.000" r="6" class="first" data-index="0" data-angle="0" />
    <line x1="245" y1="246" x2="354.018" y2="291.157" class="spoke" />
    <circle cx="354.018" cy="291.157" r="4.5" class="bullet" data-index="1" data-angle="16" />
    <line x1="245" y1="246" x2="328.439" y2="329.439" class="spoke" />
    <circle cx="328.439" cy="329.439" r="4.5" class="bullet" data-index="2" data-angle="32" />
    <line x1="245" y1="246" x2="290.157" y2="355.018" class="spoke" />
    <circle cx="290.157" cy="355.018" r="4.5" class="bullet" data-index="3" data-angle="48" />
    <line x1="245" y1="246" x2="245.000" y2="364.000" class="spoke" />
    <circle cx="245.000" cy="364.000" r="4.5" class="bullet" data-index="4" data-angle="64" />
    <line x1="245" y1="246" x2="199.843" y2="355.018" class="spoke" />
    <circle cx="199.843" cy="355.018" r="4.5" class="bullet" data-index="5" data-angle="80" />
    <line x1="245" y1="246" x2="161.561" y2="329.439" class="spoke" />
    <circle cx="161.561" cy="329.439" r="4.5" class="bullet" data-index="6" data-angle="96" />
    <line x1="245" y1="246" x2="135.982" y2="291.157" class="spoke" />
    <circle cx="135.982" cy="291.157" r="4.5" class="bullet" data-index="7" data-angle="112" />
    <line x1="245" y1="246" x2="127.000" y2="246.000" class="spoke" />
    <circle cx="127.000" cy="246.000" r="4.5" class="bullet" data-index="8" data-angle="128" />
    <line x1="245" y1="246" x2="135.982" y2="200.843" class="spoke" />
    <circle cx="135.982" cy="200.843" r="4.5" class="bullet" data-index="9" data-angle="144" />
    <line x1="245" y1="246" x2="161.561" y2="162.561" class="spoke" />
    <circle cx="161.561" cy="162.561" r="4.5" class="bullet" data-index="10" data-angle="160" />
