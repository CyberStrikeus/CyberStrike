    <line x1="730" y1="246" x2="614.267" y2="222.979" class="spoke" />
    <circle cx="614.267" cy="222.979" r="4.5" class="bullet" data-index="6" data-angle="136" />
    <line x1="730" y1="246" x2="631.887" y2="180.443" class="spoke" />
    <circle cx="631.887" cy="180.443" r="4.5" class="bullet" data-index="7" data-angle="152" />
    <line x1="730" y1="246" x2="664.443" y2="147.887" class="spoke" />
    <circle cx="664.443" cy="147.887" r="4.5" class="bullet" data-index="8" data-angle="168" />
    <line x1="730" y1="246" x2="706.979" y2="130.267" class="spoke" />
    <circle cx="706.979" cy="130.267" r="4.5" class="bullet" data-index="9" data-angle="184" />
    <line x1="730" y1="246" x2="753.021" y2="130.267" class="spoke" />
    <circle cx="753.021" cy="130.267" r="4.5" class="bullet" data-index="10" data-angle="200" />
    <line x1="730" y1="246" x2="795.557" y2="147.887" class="spoke" />
    <circle cx="795.557" cy="147.887" r="4.5" class="bullet" data-index="11" data-angle="216" />
    <line x1="730" y1="246" x2="828.113" y2="180.443" class="spoke" />
    <circle cx="828.113" cy="180.443" r="4.5" class="bullet" data-index="12" data-angle="232" />
    <line x1="730" y1="246" x2="845.733" y2="222.979" class="spoke" />
    <circle cx="845.733" cy="222.979" r="4.5" class="bullet" data-index="13" data-angle="248" />
    <line x1="730" y1="246" x2="845.733" y2="269.021" class="spoke" />
    <circle cx="845.733" cy="269.021" r="4.5" class="bullet" data-index="14" data-angle="8" />
    <line x1="730" y1="246" x2="828.113" y2="311.557" class="spoke" />
    <circle cx="828.113" cy="311.557" r="4.5" class="bullet" data-index="15" data-angle="24" />
    <circle cx="730" cy="246" r="7" fill="#20252b" />
    <rect x="700" y="261" width="60" height="26" fill="#ffffff" />
    <text x="730" y="280" text-anchor="middle" class="note">Origin</text>
    <line x1="800.557" y1="351.597" x2="829.447" y2="394.833" stroke="#294f82" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <path d="M 832.225 391.990 l 7 7 l -7 7 l -7 -7 z" fill="#294f82" />
    <text x="848.225" y="405.990" class="note accent">Player</text>
  </g>
  <text x="42" y="413" class="mono">0, 16, 32, …, 240</text>
  <text x="542" y="413" class="mono">40, 56, 72, …, 24</text>
  <rect x="24" y="451" width="952" height="47" rx="4" fill="#edf2f8" />
  <text x="500" y="481" text-anchor="middle" class="note accent">Same spacing: 256 ÷ 16 = 16 angle units = 22.5°</text>
</svg>
