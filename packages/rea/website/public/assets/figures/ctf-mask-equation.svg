<text x="358" y="231" font-weight="600">Only one cell contributes to this sum</text>
<text x="358" y="262" font-family="monospace" fill="#294f82">code[21] = 55</text>
<text x="358" y="303" font-size="25" font-weight="600" fill="#294f82">55 → '7'</text>
<text x="358" y="333" fill="#5b6570">Position 21 in the flag must contain 7.</text>
