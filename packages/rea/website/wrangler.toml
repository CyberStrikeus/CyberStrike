# Serve only the public website. The default deployment is a workers.dev preview.
name = "rea-website-preview"
compatibility_date = "2026-10-08"
workers_dev = true
preview_urls = false

[assets]
directory = "./_site"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[build]
cwd = ".."
command = "python3 scripts/website.py check"
watch_dir = ["./public", "./locales", "./templates"]

# Public HTTPS depends on zone activation and certificate readiness.
[env.production]
name = "rea-website"
workers_dev = true
preview_urls = false
routes = [{ pattern = "rea.tools", custom_domain = true }]

# Production receives the already prepared and verified shared Pages artifact.
# Override the preview build so deployment does not regenerate local assets.
[env.production.build]
command = ""
