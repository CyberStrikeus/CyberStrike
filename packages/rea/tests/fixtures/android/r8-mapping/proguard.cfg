# Keep the source inventory while exercising actual R8 name minification.
-dontshrink
-dontoptimize
-keep,allowobfuscation class ** { *; }
-keepattributes InnerClasses,EnclosingMethod,Signature,SourceFile,LineNumberTable
# Force residual classes into the default package; JADX display aliases must
# never be used as the mapping lookup identity.
-repackageclasses ''
