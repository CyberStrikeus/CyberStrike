stages:
  - version
  - build
  - publish

variables:
  BUN_VERSION: "1.3.9"
  FF_USE_FASTZIP: "true"

.setup-bun:
  before_script:
    - curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun install

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"

# ── Stage 1: calculate version ────────────────────────────────────────────────

version:
  stage: version
  image: oven/bun:1.3.9-debian
  script:
    - bun install
    - |
      export CYBERSTRIKE_BUMP="${BUMP:-canary}"
      export CYBERSTRIKE_VERSION="${VERSION:-}"
      bun run ./script/version-ci.ts
  artifacts:
    reports:
      dotenv: version.env

# ── Stage 2: build web UI + CLI binaries (parallel) ──────────────────────────

build-app:
  stage: build
  image: oven/bun:1.3.9-debian
  needs: [version]
  script:
    - bun install
    - CYBERSTRIKE_VERSION=$CYBERSTRIKE_VERSION bun turbo build --filter=@cyberstrike-io/app
  artifacts:
    paths:
      - packages/app/dist/
    expire_in: 1 hour

build-cli:
  stage: build
  image: oven/bun:1.3.9-debian
  needs: [version]
  script:
    - bun install
    - bun install --os="*" --cpu="*" @opentui/core @opentui/core-darwin-x64 @opentui/core-darwin-arm64 @opentui/core-linux-x64 @opentui/core-linux-arm64 @opentui/core-win32-x64 @opentui/core-win32-arm64 @opentui/core-linux-x64-musl @opentui/core-linux-arm64-musl
    - |
      export CYBERSTRIKE_VERSION
      export CYBERSTRIKE_RELEASE=""
      export CYBERSTRIKE_BUMP="${BUMP:-canary}"
      bun run ./packages/cyberstrike/script/build.ts --skip-install
  artifacts:
    paths:
      - packages/cyberstrike/dist/
    expire_in: 1 hour

# ── Stage 3: publish to npm ───────────────────────────────────────────────────

publish:
  stage: publish
  image: node:24-bookworm
  needs: [version, build-cli, build-app]
  script:
    - corepack enable
    - npm install -g bun@${BUN_VERSION}
    - bun install
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - |
      export CYBERSTRIKE_VERSION
      export CYBERSTRIKE_RELEASE=""
      export CYBERSTRIKE_BUMP="${BUMP:-canary}"
      bun run ./script/publish-ci.ts
  rules:
    - when: manual
      allow_failure: false
